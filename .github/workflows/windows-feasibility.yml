name: Windows Feasibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  probe:
    name: Core + Shell on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # Swift on Windows links against MSVC; the developer environment
      # (INCLUDE/LIB for UCRT and Windows SDK headers) must be active
      # before swift build runs, otherwise C modules like ucrt fail.
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Swift on Windows
        uses: SwiftyLab/setup-swift@v1
        with:
          # 6.3.1 fixes the ucrt/_Builtin_intrinsics cyclic module
          # dependency triggered by Windows SDK 10.0.26100 (swift#79745).
          # Patch-pinned for deterministic installs on hosted runners.
          swift-version: "6.3.1"

      - name: Swift version
        run: swift --version

      - name: Build all Windows targets
        run: swift build --product CoreProbe --product WindowsShell

      - name: Run CoreProbe self-check
        run: |
          $exe = Get-ChildItem -Path .build -Recurse -Filter "CoreProbe.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "CoreProbe.exe not found"; exit 1 }
          & $exe.FullName
          exit $LASTEXITCODE

      - name: Run WindowsShell self-test
        run: |
          $exe = Get-ChildItem -Path .build -Recurse -Filter "WindowsShell.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "WindowsShell.exe not found"; exit 1 }
          & $exe.FullName --self-test
          exit $LASTEXITCODE
