name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build DMG and publish to GitHub Releases
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build app and DMG
        run: bash Scripts/package-app.sh
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" build/DesktopPets.dmg --title "DesktopPets ${{ github.ref_name }}" --notes "macOS desktop pet ${{ github.ref_name }} - unsigned free distribution (see README to bypass Gatekeeper on first launch)"
