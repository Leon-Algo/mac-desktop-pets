name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build DMG and publish to GitHub Releases
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build app and DMG (route B: unsigned, free distribution)
        run: bash Scripts/package-app.sh
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/DesktopPets.dmg \
            --title "DesktopPets ${GITHUB_REF_NAME}" \
            --notes "macOS 桌面宠物 ${GITHUB_REF_NAME} · 不签名免费分发（首次打开若被 Gatekeeper 拦截，见 README 解除提示）"
